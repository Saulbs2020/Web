<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greek Odyssey Travel</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">
<style>
    * {
        box-sizing: border-box;
    }
    html {
        scroll-behavior: smooth;
    }
    body {
        margin: 0;
        font-family: 'Orbitron', sans-serif;
        background: #07111f;
        color: white;
    }
    header {
        position: fixed;
        top: 0;
        width: 100%;
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 50px;
        background: rgba(7, 17, 31, 0.85);
        backdrop-filter: blur(10px);
    }
    .logo {
        font-size: 22px;
        font-weight: 600;
    }
    nav a {
        color: white;
        text-decoration: none;
        margin-left: 25px;
        font-size: 14px;
    }
    nav a:hover {
        color: #5bc0be;
    }
    .hero {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 100px 20px;
        background:
            linear-gradient(
                rgba(0, 0, 0, 0.45),
                rgba(0, 0, 0, 0.7)
            ),
            url("https://images.unsplash.com/photo-1530841377377-3ff06c0ca713")
            center/cover;
    }
    .hero h1 {
        font-size: clamp(40px, 8vw, 80px);
        margin: 0 0 20px;
    }
    .hero p {
        max-width: 600px;
        font-size: 18px;
        line-height: 1.7;
    }
    .button {
        margin-top: 25px;
        padding: 15px 30px;
        border: none;
        border-radius: 30px;
        background: #5bc0be;
        color: white;
        font-family: 'Orbitron', sans-serif;
        font-size: 14px;
        cursor: pointer;
        transition: transform 0.2s, background 0.2s;
    }
    .button:hover {
        background: #3aafa9;
        transform: scale(1.05);
    }
    section {
        padding: 100px 8%;
    }
    .section-title {
        text-align: center;
        margin-bottom: 50px;
    }
    .destinations {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 25px;
    }
    .card {
        overflow: hidden;
        border-radius: 15px;
        background: #101d30;
        transition: transform 0.3s;
    }
    .card:hover {
        transform: translateY(-10px);
    }
    .card img {
        width: 100%;
        height: 220px;
        object-fit: cover;
    }
    .card-content {
        padding: 20px;
    }
    .card h3 {
        margin-top: 0;
    }
    .card p {
        color: #b7c4d6;
        line-height: 1.6;
    }
    .about {
        text-align: center;
        background: #0d1929;
    }
    .about p {
        max-width: 700px;
        margin: auto;
        line-height: 1.8;
        color: #b7c4d6;
    }
    footer {
        padding: 30px;
        text-align: center;
        background: #050b14;
        color: #8795a8;
    }
    @media (max-width: 600px) {
        header {
            padding: 20px;
        }
        nav a {
            margin-left: 10px;
            font-size: 11px;
        }
    }
</style>
</head>
<body>
